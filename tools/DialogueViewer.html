<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>Tehran Noir — Dialogue Viewer</title>
<style>
  :root{
    --bg:#12100e; --panel:#1d1915; --line:#352a20; --node:#251f19;
    --accent:#ffd93d; --text:#efe6d2; --dim:#a99880;
    --err:#ff6b5b; --warn:#e6a93d; --ok:#7fd18a; --info:#8fb7ff;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:Tahoma,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden;font-size:13px}
  header{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--panel);
         border-bottom:1px solid var(--line);flex-wrap:wrap}
  header b{color:var(--accent);font-size:13px;white-space:nowrap}
  button,select,input[type=text],input[type=number]{
    background:#2b231c;color:var(--text);border:1px solid #473628;border-radius:6px;
    padding:5px 9px;font-family:inherit;font-size:12px;cursor:pointer}
  input[type=text],input[type=number]{cursor:text}
  button:hover{border-color:var(--accent)}
  .grow{flex:1}
  .badge{font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);margin-inline-start:6px}
  .badge.err{color:var(--err);border-color:var(--err)}
  .badge.warn{color:var(--warn);border-color:var(--warn)}
  .badge.ok{color:var(--ok);border-color:var(--ok)}
  main{flex:1;display:flex;min-height:0}
  #stage{flex:1;position:relative;overflow:hidden;cursor:grab;
         background:radial-gradient(circle at 30% 20%,#1c1713,#0e0c0a)}
  #stage.grabbing{cursor:grabbing}
  #canvas{position:absolute;left:0;top:0;transform-origin:0 0}
  #wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}

  .node{position:absolute;width:230px;background:var(--node);border:1px solid #4a3927;
        border-radius:10px;padding:8px 10px;cursor:pointer;transition:border-color .12s}
  .node:hover{border-color:var(--accent)}
  .node.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .node.bad{border-color:var(--err)}
  .node.dim{opacity:.42}
  .node .nid{color:var(--accent);font-size:12px;font-weight:bold;direction:ltr;text-align:left;
             word-break:break-all}
  .node .nmeta{display:flex;gap:8px;margin-top:5px;font-size:10.5px;color:var(--dim);direction:ltr}
  .node .nfirst{margin-top:6px;font-size:11px;color:#cbbfae;white-space:nowrap;overflow:hidden;
                text-overflow:ellipsis}

  aside{width:400px;background:var(--panel);border-inline-start:1px solid var(--line);
        display:flex;flex-direction:column;min-height:0}
  .tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
  .tab{flex:1;background:none;border:none;border-bottom:2px solid transparent;border-radius:0;
       padding:9px 4px;color:var(--dim);font-size:12px}
  .tab.on{color:var(--accent);border-bottom-color:var(--accent)}
  .pane{display:none;overflow-y:auto;padding:12px;flex:1}
  .pane.on{display:block}
  .pane h2{font-size:12.5px;color:var(--accent);margin:14px 0 8px}
  .pane h2:first-child{margin-top:0}

  .who{display:flex;gap:8px;align-items:baseline;margin-bottom:6px;font-size:12px;color:var(--dim);
       flex-wrap:wrap}
  .who b{color:var(--text);font-size:14px}
  .castline{font-size:11px;color:var(--dim);margin-bottom:10px}
  .castline span{color:var(--info);font-family:Consolas,monospace}

  .item{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;background:#221c16}
  .item.off{opacity:.45;border-style:dashed}
  .spk{font-size:11px;color:var(--accent);direction:ltr;text-align:left;margin-bottom:4px}
  .spk i{color:var(--dim);font-style:normal;font-size:10px}
  .fa{direction:rtl;text-align:right;line-height:1.75}
  .en{direction:ltr;text-align:left;color:var(--dim);font-size:11.5px;margin-top:3px;line-height:1.5}
  .tgt{font-size:11px;color:var(--info);direction:ltr;text-align:left;margin-top:4px;font-family:Consolas,monospace}
  .tagline{font-size:11px;color:var(--warn);direction:ltr;text-align:left;font-family:Consolas,monospace;
           display:flex;gap:8px;align-items:center}
  .condchip{font-family:Consolas,monospace;font-size:10.5px;direction:ltr;text-align:left;
            color:var(--warn);background:#2f2618;border:1px solid #4a3a20;border-radius:5px;
            padding:3px 6px;margin:4px 0 0;display:inline-block;max-width:100%;overflow-wrap:anywhere}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
  .dot.on{background:var(--ok)}
  .dot.off{background:#5a4a3a}

  .msg{padding:6px 8px;border-radius:6px;margin-bottom:6px;font-size:12px;line-height:1.55}
  .msg.e{background:#3a1d18;color:#ffb3aa}
  .msg.w{background:#3a2f18;color:#ffd9a0}
  .msg .ln{color:var(--dim);font-family:Consolas,monospace;font-size:11px}

  .wrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .wrow label{width:120px;flex:none;font-size:11.5px;color:var(--dim);direction:ltr;
              text-align:left;font-family:Consolas,monospace}
  .wrow input[type=range]{flex:1;accent-color:var(--accent)}
  .wrow .val{width:34px;flex:none;text-align:center;font-size:11px;color:var(--text)}
  .wrow select,.wrow input[type=number]{flex:1;padding:3px 6px;font-size:11.5px}
  .wgroup{font-size:11px;color:var(--accent);margin:12px 0 6px;border-bottom:1px solid var(--line);padding-bottom:4px}

  #drop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
        text-align:center;color:var(--dim);font-size:14px;line-height:2.2;pointer-events:none}
  #drop kbd{background:#2b231c;border:1px solid #473628;border-radius:4px;padding:1px 6px;font-size:12px}

  #paste{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;
         justify-content:center;z-index:20}
  #paste.on{display:flex}
  #paste .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;
              width:min(900px,92vw);height:min(660px,88vh);display:flex;flex-direction:column;padding:14px;gap:10px}
  #paste h2{margin:0;font-size:14px;color:var(--accent)}
  #paste textarea{flex:1;background:#141110;color:var(--text);border:1px solid var(--line);
                  border-radius:8px;padding:10px;font-family:Consolas,monospace;font-size:12.5px;
                  direction:ltr;resize:none;line-height:1.6}
  .row{display:flex;gap:8px;justify-content:flex-start}

  /* ---- test mode ---- */
  #play{position:fixed;inset:0;background:rgba(8,7,6,.92);display:none;z-index:30;
        flex-direction:column;justify-content:flex-end;align-items:center;padding:22px;gap:10px}
  #play.on{display:flex}
  #play .bar{width:min(1000px,94vw);display:flex;gap:12px;align-items:center;
             font-size:12px;color:var(--dim);flex-wrap:wrap}
  #play .bar .sp{flex:1}
  #play .bar input[type=number]{width:74px;padding:3px 6px}
  #play .log{width:min(1000px,94vw);max-height:22vh;overflow-y:auto;display:flex;
             flex-direction:column;gap:6px;padding:2px}
  #play .lg{font-size:12.5px;line-height:1.6;opacity:.5;border-inline-start:2px solid #3a2f27;
            padding-inline-start:8px;direction:rtl;text-align:right}
  #play .lg b{color:var(--accent);font-weight:normal;font-size:11px;margin-inline-end:6px}
  #play .box{width:min(1000px,94vw);background:#191512;border:1px solid #4a3927;border-radius:14px;
             padding:16px 18px 18px;position:relative;cursor:pointer;overflow:hidden}
  #play .spk{font-size:12px;color:var(--accent);margin-bottom:8px;display:flex;gap:8px;align-items:baseline}
  #play .spk span{color:var(--dim);font-size:10.5px;font-family:Consolas,monospace}
  #play .txt{direction:rtl;text-align:right;line-height:2;font-size:17px;min-height:34px}
  #play .txt.en{direction:ltr;text-align:left;font-size:16px}
  #play .prog{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);width:0}
  #play .opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
  #play .opt{background:#221c16;border:1px solid #4a3927;border-radius:9px;padding:9px 12px;
             display:flex;gap:10px;align-items:center;font-size:14px;direction:rtl;text-align:right}
  #play .opt:hover{border-color:var(--accent)}
  #play .opt.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  #play .opt .num{color:var(--accent);font-size:11px;font-family:Consolas,monospace;flex:none}
  #play .hint{font-size:11px;color:var(--dim);margin-top:10px}
</style>
</head>
<body>

<header>
  <b>Dialogue Viewer</b>
  <select id="fileSel" title="فایل باز"></select>
  <button id="openBtn">باز کردن فایل…</button>
  <button id="pasteBtn">چسباندن متن…</button>
  <button id="fitBtn">جا دادن</button>
  <button id="mermaidBtn">کپی Mermaid</button>
  <button id="testBtn">تست ▶</button>
  <span class="grow"></span>
  <span id="badges"></span>
  <input id="fileInput" type="file" accept=".txt,.dlg,text/plain" multiple hidden>
</header>

<main>
  <div id="stage">
    <div id="canvas"><svg id="wires"></svg></div>
    <div id="drop">
      فایل <kbd>.txt</kbd> را اینجا رها کن<br>
      یا <kbd>باز کردن فایل…</kbd> یا <kbd>چسباندن متن…</kbd><br>
      <span style="font-size:12px">چند فایل را می‌توانی همزمان رها کنی</span>
    </div>
  </div>

  <aside>
    <div class="tabs">
      <button class="tab on" data-tab="detail">جزئیات</button>
      <button class="tab" data-tab="world">دنیای تست</button>
      <button class="tab" data-tab="check">بررسی</button>
    </div>
    <div class="pane on" id="pane-detail"></div>
    <div class="pane" id="pane-world"></div>
    <div class="pane" id="pane-check"></div>
  </aside>
</main>

<div id="paste">
  <div class="box">
    <h2>متن دیالوگ را بچسبان (خروجی AI یا دست‌نویس)</h2>
    <textarea id="pasteArea" spellcheck="false"></textarea>
    <div class="row">
      <button id="pasteParse">بررسی</button>
      <button id="pasteCancel">بستن</button>
    </div>
  </div>
</div>

<div id="play">
  <div class="bar">
    <span style="color:var(--accent)">تست دیالوگ</span>
    <label style="display:flex;gap:6px;align-items:center">زبان
      <select id="playLang"><option value="fa">فارسی</option><option value="en">English</option></select>
    </label>
    <label style="display:flex;gap:6px;align-items:center">ثانیه/کلمه
      <input id="playSpw" type="number" step="0.05" min="0.05" value="0.35">
    </label>
    <label style="display:flex;gap:6px;align-items:center">
      <input id="playFromSel" type="checkbox"> از گره انتخاب‌شده
    </label>
    <span class="sp"></span>
    <button id="playRestart">شروع دوباره</button>
    <button id="playClose">بستن (Esc)</button>
  </div>
  <div class="log" id="playLog"></div>
  <div class="box" id="playBox">
    <div class="spk" id="playSpk"></div>
    <div class="txt" id="playTxt">…</div>
    <div class="opts" id="playOpts"></div>
    <div class="hint" id="playHint"></div>
    <div class="prog" id="playProg"></div>
  </div>
</div>

<script>
/* ============================================================
   1) EXPRESSIONS
   ============================================================ */
var SCALARS = ['time','weather','energy','fear','sanity','trust','playerAge'];
var PREFIXES = ['rel.','met.','present.','flag.'];

function isVarName(n){
  if (!n) return false;
  if (SCALARS.indexOf(n) >= 0) return true;
  for (var i = 0; i < PREFIXES.length; i++)
    if (n.indexOf(PREFIXES[i]) === 0 && n.length > PREFIXES[i].length) return true;
  return false;
}

function tokenizeExpr(s){
  var out = [], i = 0, n = s.length;
  var two = ['>=','<=','==','!='];
  while (i < n){
    var c = s[i];
    if (/\s/.test(c)){ i++; continue; }
    if (two.indexOf(s.substr(i,2)) >= 0){ out.push({t:'op', v:s.substr(i,2)}); i += 2; continue; }
    if (c === '>' || c === '<' || c === '='){ out.push({t:'op', v:c}); i++; continue; }
    if (c === '('){ out.push({t:'('}); i++; continue; }
    if (c === ')'){ out.push({t:')'}); i++; continue; }
    if (c === '"' || c === "'"){
      var q = c, j = i + 1, buf = '';
      while (j < n && s[j] !== q){ buf += s[j]; j++; }
      out.push({t:'str', v:buf}); i = j + 1; continue;
    }
    if (/[0-9]/.test(c)){
      var j = i, d = '';
      while (j < n && /[0-9.]/.test(s[j])){ d += s[j]; j++; }
      out.push({t:'num', v:parseFloat(d)}); i = j; continue;
    }
    if (/[A-Za-z_\u0600-\u06FF]/.test(c)){
      var j = i, w = '';
      while (j < n && /[A-Za-z0-9_.\u0600-\u06FF]/.test(s[j])){ w += s[j]; j++; }
      out.push({t:'id', v:w}); i = j; continue;
    }
    throw { msg:'کاراکتر ناشناخته در شرط: «' + c + '»' };
  }
  return out;
}

function parseExpr(src){
  var toks = tokenizeExpr(src), pos = 0;

  function peek(){ return toks[pos]; }
  function eat(){ return toks[pos++]; }
  function isKw(t, k){ return t && t.t === 'id' && t.v.toLowerCase() === k; }

  function parseOr(){
    var left = parseAnd();
    while (isKw(peek(), 'or')){ eat(); left = {k:'or', a:left, b:parseAnd()}; }
    return left;
  }
  function parseAnd(){
    var left = parseNot();
    while (isKw(peek(), 'and')){ eat(); left = {k:'and', a:left, b:parseNot()}; }
    return left;
  }
  function parseNot(){
    if (isKw(peek(), 'not')){ eat(); return {k:'not', a:parseNot()}; }
    return parseCmp();
  }
  function parseCmp(){
    var left = parsePrimary();
    var t = peek();
    if (t && t.t === 'op' && ['==','!=','>','<','>=','<='].indexOf(t.v) >= 0){
      eat();
      return {k:'cmp', op:t.v, a:left, b:parsePrimary()};
    }
    return left;
  }
  function parsePrimary(){
    var t = eat();
    if (!t) throw { msg:'شرط ناقص است' };
    if (t.t === '('){
      var e = parseOr();
      var close = eat();
      if (!close || close.t !== ')') throw { msg:'پرانتز بسته نشده' };
      return e;
    }
    if (t.t === 'num') return {k:'lit', v:t.v};
    if (t.t === 'str') return {k:'lit', v:t.v};
    if (t.t === 'id'){
      var low = t.v.toLowerCase();
      if (low === 'true') return {k:'lit', v:true};
      if (low === 'false') return {k:'lit', v:false};
      return {k:'var', name:t.v};
    }
    throw { msg:'عبارت شرط نامعتبر: «' + (t.v || t.t) + '»' };
  }

  var ast = parseOr();
  if (pos < toks.length) throw { msg:'بخش اضافه در شرط: «' + toks[pos].v + '»' };
  return ast;
}

function numOf(v){
  if (typeof v === 'number') return v;
  if (typeof v === 'boolean') return v ? 1 : 0;
  if (typeof v === 'string' && v.trim() !== '' && !isNaN(Number(v))) return Number(v);
  return NaN;
}

function truthy(v){
  if (v === undefined || v === null) return false;
  if (typeof v === 'boolean') return v;
  if (typeof v === 'number') return v !== 0;
  if (typeof v === 'string') return v !== '' && v.toLowerCase() !== 'false';
  return true;
}

function evalAst(node, world){
  if (!node) return true;
  switch (node.k){
    case 'lit': return node.v;
    case 'var': return world[node.name];
    case 'not': return !truthy(evalAst(node.a, world));
    case 'and': return truthy(evalAst(node.a, world)) && truthy(evalAst(node.b, world));
    case 'or':  return truthy(evalAst(node.a, world)) || truthy(evalAst(node.b, world));
    case 'cmp': {
      var va = evalAst(node.a, world);
      var vb = evalAst(node.b, world);
      if (va === undefined && node.a.k === 'var') va = node.a.name;
      if (vb === undefined && node.b.k === 'var') vb = node.b.name;
      var na = numOf(va), nb = numOf(vb);
      var numeric = !isNaN(na) && !isNaN(nb);
      var A = numeric ? na : String(va);
      var B = numeric ? nb : String(vb);
      switch (node.op){
        case '==': return A === B;
        case '!=': return A !== B;
        case '>':  return A > B;
        case '<':  return A < B;
        case '>=': return A >= B;
        case '<=': return A <= B;
      }
      return false;
    }
  }
  return false;
}

function collectVars(ast, out){
  if (!ast) return out;
  if (ast.k === 'var'){ if (isVarName(ast.name)) out.push(ast.name); return out; }
  if (ast.a) collectVars(ast.a, out);
  if (ast.b) collectVars(ast.b, out);
  return out;
}

/* ============================================================
   2) PARSER
   ============================================================ */
var TAGS = ['person','name','role','cast','node','say','opt','go','if','else','do','end'];

function splitPipe(s){
  return s.split('|').map(function(x){ return x.trim(); });
}

function parseDoc(text, fileName){
  var errors = [], warnings = [];
  var person = { id:'', name:{fa:'',en:''}, role:{fa:'',en:''} };
  var cast = [], nodes = [], cur = null;
  var pendingGuard = [];      // [{ast, src}]
  var raw = String(text).split(/\r?\n/);

  function err(line, msg){ errors.push({ line:line, msg:msg }); }
  function warn(line, msg){ warnings.push({ line:line, msg:msg }); }

  function makeGuard(line, src){
    try { return parseExpr(src); }
    catch (e){ err(line, 'شرط نامعتبر: ' + e.msg); return null; }
  }

  for (var i = 0; i < raw.length; i++){
    var lineNo = i + 1;
    var line = raw[i].trim();
    if (!line || line.charAt(0) === '#') continue;

    var m = line.match(/^\[([A-Za-z]+)\]\s*(.*)$/);
    if (!m){ err(lineNo, 'هر خط باید با یک تگ شروع شود، مثل [say]'); continue; }

    var tag = m[1].toLowerCase();
    var rest = m[2].trim();

    if (TAGS.indexOf(tag) < 0){ err(lineNo, 'تگ ناشناخته: [' + tag + ']'); continue; }

    if (tag === 'person'){
      person.id = (rest.split(/\s+/)[0] || '').toLowerCase();
      continue;
    }
    if (tag === 'name' || tag === 'role'){
      var p = splitPipe(rest);
      if (p.length < 2){ err(lineNo, '[' + tag + '] باید «فارسی | English» باشد'); continue; }
      person[tag] = { fa:p[0], en:p[1] };
      continue;
    }
    if (tag === 'cast'){
      var cid = (rest.split(/\s+/)[0] || '').toLowerCase();
      if (!cid){ err(lineNo, '[cast] بدون شناسه'); continue; }
      if (cast.indexOf(cid) < 0) cast.push(cid);
      continue;
    }

    if (tag === 'node'){
      var id = rest.split(/\s+/)[0];
      if (!id){ err(lineNo, '[node] بدون شناسه'); continue; }
      var dup = 0;
      nodes.forEach(function(n){ if (n.baseId === id) dup++; });
      if (dup > 0) err(lineNo, 'شناسه تکراری: «' + id + '»');
      cur = { id: dup > 0 ? (id + '#' + (dup + 1)) : id, baseId:id, line:lineNo,
              items:[], links:[], term:false };
      nodes.push(cur);
      pendingGuard = [];
      continue;
    }

    if (!cur){ err(lineNo, 'این خط قبل از اولین [node] آمده'); continue; }
    var guard = pendingGuard.map(function(g){ return g.ast; });
    var guardStr = pendingGuard.map(function(g){ return g.src; }).join('  and  ');

    if (tag === 'if'){
      var arrowAt = rest.lastIndexOf('->');
      if (arrowAt >= 0){
        var condSrc = rest.slice(0, arrowAt).trim();
        var dest = rest.slice(arrowAt + 2).trim().split(/\s+/)[0];
        var g = makeGuard(lineNo, condSrc);
        if (!dest) err(lineNo, '[if] مقصد ندارد');
        cur.items.push({ kind:'redirect', line:lineNo, text:condSrc, guard:guard, guardStr:guardStr, target:dest, ast:g });
        cur.links.push({ target:dest, kind:'redirect', line:lineNo, auto:true });
      } else {
        var g2 = makeGuard(lineNo, rest);
        cur.items.push({ kind:'if', line:lineNo, text:rest, guard:[], ast:g2 });
        pendingGuard = g2 ? [{ ast:g2, src:rest }] : [];
      }
      continue;
    }

    if (tag === 'say'){
      var s = splitPipe(rest);
      if (s.length < 3){ err(lineNo, '[say] باید «گوینده | فارسی | English» باشد'); continue; }
      if (!s[0]) warn(lineNo, 'گوینده خالی است');
      if (!s[1]) warn(lineNo, 'ترجمه‌ی فارسی خالی است');
      if (!s.slice(2).join(' | ').trim()) warn(lineNo, 'ترجمه‌ی انگلیسی خالی است');
      cur.items.push({ kind:'say', line:lineNo, speaker:s[0].toLowerCase(),
                       fa:s[1], en:s.slice(2).join(' | '), guard:guard, guardStr:guardStr });
      continue;
    }

    if (tag === 'opt'){
      var at = rest.lastIndexOf('->');
      if (at < 0){ err(lineNo, '[opt] باید با  -> مقصد  تمام شود'); continue; }
      var label = rest.slice(0, at).trim();
      var target = rest.slice(at + 2).trim().split(/\s+/)[0];
      var o = splitPipe(label);
      if (o.length < 2){ err(lineNo, '[opt] باید «فارسی | English -> مقصد» باشد'); continue; }
      if (!target){ err(lineNo, '[opt] مقصد خالی است'); continue; }
      cur.items.push({ kind:'opt', line:lineNo, fa:o[0], en:o[1], target:target, guard:guard, guardStr:guardStr });
      cur.links.push({ target:target, kind:'opt', line:lineNo });
      cur.term = true;
      continue;
    }

    if (tag === 'go'){
      var gt = rest.split(/\s+/)[0];
      if (!gt){ err(lineNo, '[go] مقصد ندارد'); continue; }
      cur.items.push({ kind:'go', line:lineNo, target:gt, guard:guard, guardStr:guardStr });
      cur.links.push({ target:gt, kind:'go', line:lineNo, auto:true });
      cur.term = true;
      continue;
    }

    if (tag === 'else'){
      cur.items.push({ kind:'else', line:lineNo, guard:[], text:'' });
      pendingGuard = [];
      continue;
    }

    if (tag === 'do'){
      if (!rest){ err(lineNo, '[do] خالی است'); continue; }
      cur.items.push({ kind:'do', line:lineNo, text:rest, guard:guard, guardStr:guardStr });
      continue;
    }

    if (tag === 'end'){
      cur.items.push({ kind:'end', line:lineNo, guard:guard, guardStr:guardStr });
      cur.term = true;
      continue;
    }
  }

  if (!person.id) warn(1, '[person] تعریف نشده');
  if (nodes.length === 0) err(1, 'هیچ [node] پیدا نشد');

  var ids = {};
  nodes.forEach(function(n){ ids[n.id] = true; });

  nodes.forEach(function(n){
    var hasTerm = n.links.length > 0;
    var terminal = false;
    n.items.forEach(function(it){ if (it.kind === 'end') terminal = true; });
    if (!hasTerm && !terminal)
      err(n.line, 'node «' + n.id + '» نه [opt]/[go]/[end] دارد — بن‌بست');

    var unguarded = false;
    n.items.forEach(function(it){
      if ((it.kind === 'opt' || it.kind === 'go' || it.kind === 'redirect') &&
          (!it.guard || it.guard.length === 0))
        unguarded = true;
    });
    if (hasTerm && !unguarded && !terminal)
      warn(n.line, 'node «' + n.id + '» فقط مسیرهای شرطی دارد؛ اگر هیچ شرطی برقرار نشود، دیالوگ تمام می‌شود');
  });

  nodes.forEach(function(n){
    n.links.forEach(function(l){
      if (!ids[l.target]) err(l.line, 'مقصد پیدا نشد: «' + l.target + '»');
    });
  });

  nodes.forEach(function(n){
    n.items.forEach(function(it){
      if (it.kind === 'say' && cast.length && cast.indexOf(it.speaker) < 0)
        warn(it.line, 'گوینده «' + it.speaker + '» در [cast] نیست');
    });
  });

  var usedVars = [];
  nodes.forEach(function(n){
    n.items.forEach(function(it){
      if (it.ast) collectVars(it.ast, usedVars);
      (it.guard || []).forEach(function(g){ collectVars(g, usedVars); });
    });
  });
  var uniq = [];
  usedVars.forEach(function(v){ if (uniq.indexOf(v) < 0) uniq.push(v); });

  return { file:fileName || '', person:person, cast:cast, nodes:nodes,
           errors:errors, warnings:warnings, vars:uniq.sort() };
}

/* ============================================================
   3) LAYOUT
   ============================================================ */
function layout(doc){
  var byId = {};
  doc.nodes.forEach(function(n){ byId[n.id] = n; });

  var depth = {};
  if (doc.nodes.length){
    var q = [doc.nodes[0]];
    depth[doc.nodes[0].id] = 0;
    while (q.length){
      var n = q.shift();
      var d = depth[n.id];
      n.links.forEach(function(l){
        var t = byId[l.target];
        if (t && depth[t.id] === undefined){ depth[t.id] = d + 1; q.push(t); }
      });
    }
  }

  var maxDepth = 0;
  doc.nodes.forEach(function(n){ if (depth[n.id] !== undefined) maxDepth = Math.max(maxDepth, depth[n.id]); });
  var orphanDepth = maxDepth + 1;

  var layers = {};
  doc.nodes.forEach(function(n){
    var d = (depth[n.id] === undefined) ? orphanDepth : depth[n.id];
    (layers[d] = layers[d] || []).push(n);
  });

  var COL = 340, ROW = 175, pos = {}, unreachable = [];
  Object.keys(layers).map(Number).sort(function(a,b){ return a - b; }).forEach(function(d){
    var list = layers[d];
    var h = (list.length - 1) * ROW;
    list.forEach(function(n, i){
      pos[n.id] = { x: d * COL, y: i * ROW - h / 2 };
      if (depth[n.id] === undefined) unreachable.push(n);
    });
  });

  return { pos:pos, depth:depth, unreachable:unreachable };
}

/* ============================================================
   4) WORLD
   ============================================================ */
function baseWorld(){
  return { time:'morning', weather:'clear', energy:100, fear:0 };
}

function buildWorld(vars, current){
  var w = baseWorld();
  if (current) for (var k in current) if (current.hasOwnProperty(k)) w[k] = current[k];
  vars.forEach(function(v){
    if (w[v] !== undefined) return;
    if (v.indexOf('rel.') === 0) w[v] = 0;
    else if (v.indexOf('met.') === 0 || v.indexOf('present.') === 0) w[v] = false;
    else w[v] = 0;
  });
  return w;
}

function guardOk(guards, world){
  if (!guards || !guards.length) return true;
  for (var i = 0; i < guards.length; i++)
    if (!truthy(evalAst(guards[i], world))) return false;
  return true;
}

/* شرط خودِ خط + شرط چسبیده (sticky) — برای [if] ... -> target هر دو لازم است */
function itemOk(it, world){
  if (!it) return false;
  if (!guardOk(it.guard, world)) return false;
  if (it.kind === 'redirect' && it.ast) return truthy(evalAst(it.ast, world));
  return true;
}

/* ============================================================
   5) STATE / HELPERS
   ============================================================ */
var state = {
  docs:[], index:0, doc:null, L:null, sel:null,
  scale:1, tx:60, ty:300,
  world:{}, showActive:true, registry:{}
};

function $(id){ return document.getElementById(id); }

function el(tag, cls, html){
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function displayName(id){
  var r = state.registry[id];
  if (r && r.name) return r.name;
  return id;
}

function applyTransform(){
  $('canvas').style.transform =
    'translate(' + state.tx + 'px,' + state.ty + 'px) scale(' + state.scale + ')';
}

function badges(){
  var d = state.doc, b = $('badges');
  b.innerHTML = '';
  if (!d) return;
  var e = d.errors.length, w = d.warnings.length, n = d.nodes.length;
  b.appendChild(el('span','badge ' + (e ? 'err' : 'ok'), e ? ('✕ ' + e + ' خطا') : '✓ بی‌خطا'));
  if (w) b.appendChild(el('span','badge warn','! ' + w + ' هشدار'));
  b.appendChild(el('span','badge', n + ' node'));
}

/* ============================================================
   6) DETAIL PANE
   ============================================================ */
function renderDetail(){
  var pane = $('pane-detail'), d = state.doc, world = state.world;
  pane.innerHTML = '';
  if (!d) return;

  var nm = d.person.name, rl = d.person.role;
  var who = el('div','who');
  who.innerHTML = '<b>' + esc(nm.fa || nm.en || d.person.id || '—') + '</b>' +
                  '<span>' + esc(nm.en) + '</span>' +
                  (rl.fa || rl.en ? '<span>— ' + esc(rl.fa || rl.en) + '</span>' : '');
  pane.appendChild(who);

  if (d.cast.length){
    var cl = el('div','castline','حاضران: ');
    d.cast.forEach(function(c, i){
      cl.appendChild(el('span', null, (i ? '، ' : '') + displayName(c)));
    });
    pane.appendChild(cl);
  }

  var node = null;
  if (state.sel) d.nodes.forEach(function(n){ if (n.id === state.sel) node = n; });

  pane.appendChild(el('h2', null, node ? ('node: ' + node.id) : 'یک node را کلیک کن'));
  if (!node) return;

  node.items.forEach(function(it){
    var ok = (it.kind === 'if' || it.kind === 'else') ? true : itemOk(it, world);
    var cls = 'item' + (ok ? '' : ' off');
    var guardHtml = it.guardStr
      ? '<div class="condchip">' + esc(it.guardStr) + '</div>'
      : '';

    if (it.kind === 'say'){
      var dot = '<span class="dot ' + (ok ? 'on' : 'off') + '"></span>';
      pane.appendChild(el('div', cls,
        '<div class="spk">' + dot + ' ' + esc(it.speaker) +
        ' <i>' + esc(displayName(it.speaker) !== it.speaker ? displayName(it.speaker) : '') + '</i></div>' +
        '<div class="fa">' + esc(it.fa) + '</div>' +
        '<div class="en">' + esc(it.en) + '</div>' +
        guardHtml));
    } else if (it.kind === 'opt'){
      pane.appendChild(el('div', cls,
        '<div class="tagline"><span class="dot ' + (ok ? 'on' : 'off') + '"></span> option</div>' +
        '<div class="fa">' + esc(it.fa) + '</div>' +
        '<div class="en">' + esc(it.en) + '</div>' +
        '<div class="tgt">→ ' + esc(it.target) + '</div>' +
        guardHtml));
    } else if (it.kind === 'go'){
      pane.appendChild(el('div', cls,
        '<div class="tagline"><span class="dot ' + (ok ? 'on' : 'off') + '"></span> go</div>' +
        '<div class="tgt">→ ' + esc(it.target) + '</div>' + guardHtml));
    } else if (it.kind === 'redirect'){
      pane.appendChild(el('div', cls,
        '<div class="tagline"><span class="dot ' + (ok ? 'on' : 'off') + '"></span> if → redirect</div>' +
        '<div class="condchip">' + esc(it.text) + '</div>' +
        '<div class="tgt">→ ' + esc(it.target) + '</div>'));
    } else if (it.kind === 'if'){
      pane.appendChild(el('div','item',
        '<div class="tagline">? if (guard)</div>' +
        '<div class="condchip">' + esc(it.text) + '</div>'));
    } else if (it.kind === 'do'){
      pane.appendChild(el('div', cls,
        '<div class="tagline"><span class="dot ' + (ok ? 'on' : 'off') + '"></span> do</div>' +
        '<div class="condchip">' + esc(it.text) + '</div>'));
    } else if (it.kind === 'end'){
      pane.appendChild(el('div', cls, '<div class="tagline"><span class="dot ' +
        (ok ? 'on' : 'off') + '"></span> end</div>'));
    } else if (it.kind === 'else'){
      pane.appendChild(el('div','item','<div class="tagline">↺ else (پایان شرط)</div>'));
    }
  });
}

/* ============================================================
   7) WORLD PANE
   ============================================================ */
function renderWorldPane(){
  var pane = $('pane-world'), d = state.doc;
  pane.innerHTML = '';
  if (!d) return;

  pane.appendChild(el('h2', null, 'دنیای تست'));
  pane.appendChild(el('div','castline',
    'مقادیر را عوض کن تا ببینی کدام گزینه‌ها و مسیرها فعال می‌شوند.'));

  var toggle = document.createElement('label');
  toggle.style.cssText = 'display:flex;gap:8px;align-items:center;font-size:12px;margin-bottom:12px;color:var(--dim)';
  var cb = document.createElement('input');
  cb.type = 'checkbox'; cb.checked = state.showActive;
  cb.addEventListener('change', function(){ state.showActive = cb.checked; render(); });
  toggle.appendChild(cb);
  toggle.appendChild(document.createTextNode('مسیرهای غیرفعال را محو کن'));
  pane.appendChild(toggle);

  var groups = { 'زمان و هوا': [], 'کاراکتر': [], 'رابطه': [], 'پرچم‌ها': [], 'سایر': [] };
  d.vars.forEach(function(v){
    if (v === 'time' || v === 'weather') groups['زمان و هوا'].push(v);
    else if (v.indexOf('rel.') === 0) groups['رابطه'].push(v);
    else if (v.indexOf('met.') === 0 || v.indexOf('present.') === 0) groups['کاراکتر'].push(v);
    else if (v.indexOf('flag.') === 0) groups['پرچم‌ها'].push(v);
    else groups['کاراکتر'].push(v);
  });

  function row(labelText, inputEl){
    var r = el('div','wrow');
    r.appendChild(el('label', null, esc(labelText)));
    r.appendChild(inputEl);
    return r;
  }

  Object.keys(groups).forEach(function(g){
    var list = groups[g];
    if (!list.length) return;
    pane.appendChild(el('div','wgroup', g));
    list.forEach(function(v){
      if (v === 'time' || v === 'weather'){
        var opts = v === 'time'
          ? ['morning','noon','evening','night']
          : ['clear','rain','fog','snow'];
        var sel = document.createElement('select');
        opts.forEach(function(o){
          var op = document.createElement('option');
          op.value = o; op.textContent = o;
          if (state.world[v] === o) op.selected = true;
          sel.appendChild(op);
        });
        sel.addEventListener('change', function(){ state.world[v] = sel.value; render(); });
        pane.appendChild(row(v, sel));
      } else if (v.indexOf('met.') === 0 || v.indexOf('present.') === 0){
        var holder = el('div');
        holder.style.cssText = 'flex:1;display:flex;align-items:center;gap:8px';
        var cb2 = document.createElement('input');
        cb2.type = 'checkbox'; cb2.checked = !!state.world[v];
        cb2.addEventListener('change', function(){ state.world[v] = cb2.checked; render(); });
        holder.appendChild(cb2);
        holder.appendChild(el('span', null,
          '<span style="font-size:11px;color:var(--dim)">' + esc(v.split('.')[1]) + '</span>'));
        pane.appendChild(row(v, holder));
      } else if (v.indexOf('flag.') === 0){
        var inp = document.createElement('input');
        inp.type = 'number'; inp.value = Number(state.world[v] || 0);
        inp.addEventListener('input', function(){ state.world[v] = Number(inp.value) || 0; render(); });
        pane.appendChild(row(v, inp));
      } else {
        var valSpan = el('span','val', String(Number(state.world[v] || 0)));
        var rng = document.createElement('input');
        rng.type = 'range'; rng.min = 0; rng.max = 100;
        rng.value = Number(state.world[v] || 0);
        rng.addEventListener('input', function(){
          state.world[v] = Number(rng.value);
          valSpan.textContent = rng.value;
          renderGraphOnly();
          renderDetail();
        });
        var r = el('div','wrow');
        r.appendChild(el('label', null, esc(v)));
        r.appendChild(rng);
        r.appendChild(valSpan);
        pane.appendChild(r);
      }
    });
  });

  if (!d.vars.length)
    pane.appendChild(el('div','castline','این فایل هیچ شرطی ندارد.'));
}

   8) CHECK PANE

function renderCheck(){
  var pane = $('pane-check'), d = state.doc;
  pane.innerHTML = '';
  if (!d) return;

  pane.appendChild(el('h2', null, 'خطاها (' + d.errors.length + ')'));
  if (!d.errors.length) pane.appendChild(el('div','msg', 'هیچ خطایی نیست.'));
  d.errors.forEach(function(x){
    pane.appendChild(el('div','msg e','<span class="ln">خط ' + x.line + '</span> — ' + esc(x.msg)));
  });

  pane.appendChild(el('h2', null, 'هشدارها (' + d.warnings.length + ')'));

  });

      pane.appendChild(el('div','msg w',

}

/* ============================================================
   9) GRAPH
   ============================================================ */
function availableLinks(node, world){
  var out = [];
  node.items.forEach(function(it){
    if ((it.kind === 'opt' || it.kind === 'go' || it.kind === 'redirect') && itemOk(it, world))
      out.push(it.target);
  });
  return out;
}

function activeNodes(doc, world, startId){
  var byId = {};
  doc.nodes.forEach(function(n){ byId[n.id] = n; });
  var seen = {}, stack = [];
  var start = byId[startId];
  if (!start) return seen;
  seen[startId] = true; stack.push(start);
  while (stack.length){
    var n = stack.pop();
    availableLinks(n, world).forEach(function(t){
      if (!byId[t] || seen[t]) return;
      seen[t] = true; stack.push(byId[t]);
    });
  }
  return seen;
}

function drawWires(){
  var d = state.doc, L = state.L;
  var svg = $('wires');
  svg.innerHTML = '';
  if (!d || !L) return;

  var nodeEls = {};
  var all = $('canvas').querySelectorAll('.node');
  for (var i = 0; i < all.length; i++) nodeEls[all[i].getAttribute('data-id')] = all[i];

  var active = state.showActive ? activeNodes(d, state.world, d.nodes[0].id) : null;

  d.nodes.forEach(function(n){
    var a = nodeEls[n.id];
    if (!a) return;
    var seenEdge = {};
    n.links.forEach(function(l){
      var b = nodeEls[l.target];
      var x1 = a.offsetLeft + a.offsetWidth;
      var y1 = a.offsetTop + a.offsetHeight / 2;
      var x2, y2;
      if (b){ x2 = b.offsetLeft; y2 = b.offsetTop + b.offsetHeight / 2; }
      else { x2 = a.offsetLeft + a.offsetWidth + 90; y2 = y1 + 40; }

      var key = l.target + '|' + l.auto;
      seenEdge[key] = (seenEdge[key] || 0) + 1;
      var bend = (seenEdge[key] - 1) * 26;

      var dx = Math.max(40, Math.abs(x2 - x1) * 0.5);
      var path = document.createElementNS('http://www.w3.org/2000/svg','path');
      var dstr = (l.target === n.id)
        ? 'M ' + x1 + ' ' + (y1 - 10) + ' C ' + (x1 + 70) + ' ' + (y1 - 80) + ', ' +
          (x1 + 70) + ' ' + (y1 + 80) + ', ' + x1 + ' ' + (y1 + 10)
        : 'M ' + x1 + ' ' + y1 + ' C ' + (x1 + dx) + ' ' + (y1 + bend) + ', ' +
          (x2 - dx) + ' ' + (y2 + bend) + ', ' + x2 + ' ' + y2;
      path.setAttribute('d', dstr);
      path.setAttribute('fill','none');

      var stroke = b ? (l.auto ? '#6d8f6a' : '#8a7038') : '#a33';
      if (b && active && (!active[n.id] || !active[l.target])) stroke = '#3a2f27';
      path.setAttribute('stroke', stroke);
      path.setAttribute('stroke-width','1.6');
      if (l.auto) path.setAttribute('stroke-dasharray','5 4');
      svg.appendChild(path);

      if (!b){
        var t = document.createElementNS('http://www.w3.org/2000/svg','text');
        t.setAttribute('x', x2 - 70); t.setAttribute('y', y2 + 4);
        t.setAttribute('fill','#ff6b5b'); t.setAttribute('font-size','11');
        t.textContent = '؟ ' + l.target;
        svg.appendChild(t);
      }
    });
  });
}

function renderGraphOnly(){
  var d = state.doc;
  if (!d || !d.nodes.length) return;
  var active = state.showActive ? activeNodes(d, state.world, d.nodes[0].id) : null;
  var all = $('canvas').querySelectorAll('.node');
  for (var i = 0; i < all.length; i++){
    var id = all[i].getAttribute('data-id');
    var dim = active && !active[id];
    all[i].classList.remove('dim');
    if (dim) all[i].classList.add('dim');
  }
  drawWires();
}

function render(){
  var canvas = $('canvas');
  var svg = $('wires');
  canvas.innerHTML = '';
  canvas.appendChild(svg);
  svg.innerHTML = '';

  var d = state.doc;
  $('drop').style.display = (d && d.nodes.length) ? 'none' : 'flex';

  if (!d || !d.nodes.length){
    state.L = null;
    renderDetail(); renderWorldPane(); renderCheck(); badges(); applyTransform();
    return;
  }

  var L = layout(d);
  state.L = L;

  var minX = Infinity, minY = Infinity;
  d.nodes.forEach(function(n){
    var p = L.pos[n.id];
    minX = Math.min(minX, p.x); minY = Math.min(minY, p.y);
  });
  var OFF = 70;

  var badIds = {};
  d.errors.forEach(function(x){
    var mm = /node «(.+?)»/.exec(x.msg);
    if (mm) badIds[mm[1]] = true;
  });

  var active = state.showActive ? activeNodes(d, state.world, d.nodes[0].id) : null;

  d.nodes.forEach(function(n){
    var p = L.pos[n.id];
    var e = el('div','node');
    if (badIds[n.id]) e.className += ' bad';
    if (state.sel === n.id) e.className += ' sel';
    if (active && !active[n.id]) e.className += ' dim';
    e.style.left = (p.x - minX + OFF) + 'px';
    e.style.top  = (p.y - minY + OFF) + 'px';
    e.setAttribute('data-id', n.id);

    var firstSay = null, optCount = 0, endCount = 0, condCount = 0;
    n.items.forEach(function(it){
      if (it.kind === 'say' && !firstSay && guardOk(it.guard, state.world)) firstSay = it;
      if (it.kind === 'opt') optCount++;
      if (it.kind === 'end') endCount++;
      if (it.kind === 'if' || it.kind === 'redirect') condCount++;
    });

    var flags = [];
    if (optCount) flags.push('▸ ' + optCount);
    if (endCount) flags.push('■ end');
    if (condCount) flags.push('? ' + condCount);

    e.innerHTML =
      '<div class="nid">' + esc(n.id) + '</div>' +
      '<div class="nmeta">' + (flags.length ? esc(flags.join('   ')) : '…') + '</div>' +
      (firstSay ? '<div class="nfirst">' + esc(firstSay.fa || firstSay.en) + '</div>' : '');

    e.addEventListener('click', function(){
      state.sel = n.id;
      var all = canvas.querySelectorAll('.node');
      for (var i = 0; i < all.length; i++) all[i].classList.remove('sel');
      e.classList.add('sel');
      setTab('detail');
      renderDetail();
    });

    canvas.appendChild(e);
  });

  drawWires();
  renderDetail();
  renderWorldPane();
  renderCheck();
  badges();
  applyTransform();
}

/* ============================================================
   10) DOC LOADING
   ============================================================ */
function buildRegistry(docs){
  var reg = {};
  docs.forEach(function(doc){
    if (doc.person && doc.person.id){
      reg[doc.person.id] = {
        name: doc.person.name.fa || doc.person.name.en || doc.person.id,
        role: doc.person.role.fa || doc.person.role.en || ''
      };
    }
  });
  return reg;
}

function loadDocs(docs){
  if (typeof playStop === 'function' && play && play.on) playStop();
  state.docs = docs;
  state.index = 0;
  state.doc = docs.length ? docs[0] : null;
  state.sel = null;
  state.registry = buildRegistry(docs);

  var vars = state.doc ? state.doc.vars : [];
  state.world = buildWorld(vars, state.world);

  var sel = $('fileSel');
  sel.innerHTML = '';
  docs.forEach(function(d, i){
    var o = document.createElement('option');
    o.value = String(i);
    o.textContent = (d.person.id || d.file || ('file ' + (i + 1)));
    sel.appendChild(o);
  });

  render();
}

/* ============================================================
   11) TEST MODE (پخش دیالوگ مثل بازی)
   ============================================================ */
var play = {
  on:false, raf:0, last:0, run:null,
  lang:'fa', spw:0.35,
  gpAdv:false, gpUp:false, gpDown:false
};

function playWordCount(s){
  return String(s || '').trim().split(/\s+/).filter(function(w){ return w.length > 0; }).length;
}

function playText(it){
  if (!it) return '';
  return play.lang === 'en' ? (it.en || it.fa || '') : (it.fa || it.en || '');
}

function playApplyEffect(src, world){
  var m = /^\s*([A-Za-z0-9_.]+)\s*([+\-=])\s*(.+?)\s*$/.exec(src);
  if (!m) return;
  var name = m[1], op = m[2], raw = m[3];
  if (op === '='){
    if (raw === 'true') world[name] = true;
    else if (raw === 'false') world[name] = false;
    else if (!isNaN(Number(raw))) world[name] = Number(raw);
    else world[name] = raw;
    return;
  }
  var cur = Number(world[name]);
  if (isNaN(cur)) cur = 0;
  var d = Number(raw);
  if (isNaN(d)) return;
  world[name] = cur + (op === '+' ? d : -d);
}

function playJump(target){
  var found = null;
  state.doc.nodes.forEach(function(n){ if (n.id === target) found = n; });
  if (!found){ playFinish(); return false; }
  var run = play.run;
  run.node = found;
  run.idx = 0;
  run.line = null;
  run.lastLine = null;
  return true;
}

function playStep(){
  var run = play.run;
  if (!run || run.done) return;

  var guardSteps = 0;
  for (;;){
    if (++guardSteps > 4000){ playFinish(); return; }
    if (run.idx >= run.node.items.length){ playFinish(); return; }

    var it = run.node.items[run.idx++];
    var ok = itemOk(it, run.world);

    if (it.kind === 'if' || it.kind === 'else') continue;

    if (it.kind === 'redirect'){
      if (ok && it.target){ if (!playJump(it.target)) return; }
      continue;
    }
    if (it.kind === 'do'){
      if (ok) playApplyEffect(it.text, run.world);
      continue;
    }
    if (it.kind === 'say'){
      if (!ok) continue;
      run.line = it;
      run.lastLine = it;
      run.dur = Math.max(1.2, playWordCount(playText(it)) * play.spw);
      run.elapsed = 0;
      run.log.push(it);
      playRender();
      return;
    }
    if (it.kind === 'opt'){
      var opts = [];
      if (ok) opts.push(it);
      while (run.idx < run.node.items.length && run.node.items[run.idx].kind === 'opt'){
        var nx = run.node.items[run.idx++];
        if (itemOk(nx, run.world)) opts.push(nx);
      }
      if (!opts.length) continue;
      run.opts = opts;
      run.sel = 0;
      run.dur = 0;
      run.elapsed = 0;
      playRender();
      return;
    }
    if (it.kind === 'go'){
      if (ok && it.target){ if (!playJump(it.target)) return; }
      continue;
    }
    if (it.kind === 'end'){
      if (ok){ playFinish(); return; }
      continue;
    }
  }
}

function playAdvance(){
  var run = play.run;
  if (!run) return;
  if (run.done){ playStop(); return; }
  if (run.opts) return;
  if (!run.line) return;
  run.line = null;
  playStep();
}

function playChoose(i){
  var run = play.run;
  if (!run || !run.opts) return;
  var o = run.opts[i];
  if (!o) return;
  run.opts = null;
  run.line = null;
  run.lastLine = null;
  if (o.target && playJump(o.target)) playStep();
  else playFinish();
}

function playFinish(){
  var run = play.run;
  if (!run || run.done) return;
  run.done = true;
  run.opts = null;
  run.line = null;
  var pid = state.doc.person && state.doc.person.id;
  if (pid) run.world['met.' + pid] = true;
  playRender();
}

function playRender(){
  var run = play.run;
  if (!run) return;

  var spk = $('playSpk'), txt = $('playTxt'), opts = $('playOpts'),
      hint = $('playHint'), bar = $('playProg'), log = $('playLog');
  if (!spk || !txt || !opts || !hint || !bar || !log) return;

  log.innerHTML = '';
  var from = Math.max(0, run.log.length - 10);
  for (var i = from; i < run.log.length; i++){
    var li = run.log[i];
    log.appendChild(el('div','lg',
      '<b>' + esc(displayName(li.speaker)) + '</b>' + esc(playText(li))));
  }
  log.scrollTop = log.scrollHeight;

  bar.style.width = '0%';
  opts.innerHTML = '';

  if (run.done){
    spk.innerHTML = '';
    txt.textContent = '— پایان دیالوگ —';
    txt.className = 'txt';
    hint.textContent = 'کلیک یا Esc برای بستن';
    return;
  }

  var shown = run.line || run.lastLine;
  if (shown){
    spk.innerHTML = esc(displayName(shown.speaker)) +
      ' <span>' + esc(shown.speaker) + '</span>';
    txt.textContent = playText(shown);
    txt.className = 'txt' + (play.lang === 'en' ? ' en' : '');
  } else {
    spk.innerHTML = '';
    txt.textContent = '…';
    txt.className = 'txt';
  }

  if (run.opts){
    run.opts.forEach(function(o, idx){
      var d = el('div','opt' + (idx === run.sel ? ' sel' : ''),
        '<span class="num">' + (idx + 1) + '</span><span>' + esc(playText(o)) + '</span>');
      d.addEventListener('click', function(ev){
        ev.stopPropagation();
        playChoose(idx);
      });
      opts.appendChild(d);
    });
    hint.textContent = 'یک گزینه را انتخاب کن — کلیک / ۱ تا ۹ / Enter';
  } else {
    hint.textContent = 'کلیک روی کادر / Space / B دسته = خط بعدی';
  }
}

function playPollGamepad(){
  var pads = [];
  try { pads = (navigator.getGamepads ? navigator.getGamepads() : []) || []; } catch (e){ return; }
  var advance = false, up = false, down = false;
  for (var i = 0; i < pads.length; i++){
    var gp = pads[i];
    if (!gp || !gp.buttons) continue;
    if (gp.buttons[0] && gp.buttons[0].pressed) advance = true;   // A
    if (gp.buttons[1] && gp.buttons[1].pressed) advance = true;   // B
    if (gp.buttons[12] && gp.buttons[12].pressed) up = true;      // D-pad up
    if (gp.buttons[13] && gp.buttons[13].pressed) down = true;    // D-pad down
  }

  var run = play.run;
  if (run && run.opts && !run.done){
    if (up && !play.gpUp){ run.sel = Math.max(0, run.sel - 1); playRender(); }
    else if (down && !play.gpDown){ run.sel = Math.min(run.opts.length - 1, run.sel + 1); playRender(); }
    if (advance && !play.gpAdv) playChoose(run.sel);
  } else if (advance && !play.gpAdv){
    playAdvance();
  }

  play.gpAdv = advance;
  play.gpUp = up;
  play.gpDown = down;
}

function playLoop(ts){
  if (!play.on) return;
  play.raf = requestAnimationFrame(playLoop);

  var run = play.run;
  if (!run) return;

  var now = (typeof ts === 'number') ? ts : performance.now();
  var dt = play.last ? (now - play.last) / 1000 : 0;
  play.last = now;
  if (dt < 0) dt = 0;
  if (dt > 0.5) dt = 0.5;

  playPollGamepad();

  if (!run.done && run.line && !run.opts && run.dur > 0){
    run.elapsed += dt;
    var p = Math.min(1, run.elapsed / run.dur);
    var bar = $('playProg');
    if (bar) bar.style.width = (p * 100).toFixed(1) + '%';
    if (p >= 1) playAdvance();
  }
}

function playStart(){
  var d = state.doc;
  if (!d || !d.nodes.length) return;

  var startNode = d.nodes[0];
  var fromSel = $('playFromSel');
  if (fromSel && fromSel.checked && state.sel){
    d.nodes.forEach(function(n){ if (n.id === state.sel) startNode = n; });
  }

  var langSel = $('playLang');
  if (langSel) play.lang = langSel.value || 'fa';

  var spwIn = $('playSpw');
  if (spwIn){
    var v = Number(spwIn.value);
    play.spw = (isNaN(v) || v <= 0) ? 0.35 : v;
  }

  play.run = {
    world: Object.assign({}, state.world),
    node: startNode,
    idx: 0,
    line: null,
    lastLine: null,
    opts: null,
    sel: 0,
    dur: 0,
    elapsed: 0,
    done: false,
    log: []
  };

  $('play').classList.add('on');
  play.on = true;
  play.last = 0;
  play.gpAdv = false;
  play.gpUp = false;
  play.gpDown = false;

  playStep();

  if (play.raf) cancelAnimationFrame(play.raf);
  play.raf = requestAnimationFrame(playLoop);
}

function playStop(){
  play.on = false;
  play.run = null;
  var panel = $('play');
  if (panel) panel.classList.remove('on');
  if (play.raf) cancelAnimationFrame(play.raf);
  play.raf = 0;
}

(function initPlay(){
  var btn = $('testBtn');
  if (btn){
    btn.addEventListener('click', function(){
      if (!state.doc || !state.doc.nodes.length){ setTab('check'); return; }
      playStart();
    });
  }
  var close = $('playClose');
  if (close) close.addEventListener('click', playStop);
  var restart = $('playRestart');
  if (restart) restart.addEventListener('click', playStart);

  var langSel = $('playLang');
  if (langSel){
    langSel.addEventListener('change', function(){
      play.lang = langSel.value;
      if (play.run) playRender();
    });
  }

  var spwIn = $('playSpw');
  if (spwIn){
    spwIn.addEventListener('input', function(){
      var v = Number(spwIn.value);
      play.spw = (isNaN(v) || v <= 0) ? 0.35 : v;
      var run = play.run;
      if (run && run.line) run.dur = Math.max(1.2, playWordCount(playText(run.line)) * play.spw);
    });
  }

  var box = $('playBox');
  if (box){
    box.addEventListener('click', function(){
      var run = play.run;
      if (!run) return;
      if (run.done){ playStop(); return; }
      if (run.opts) return;
      playAdvance();
    });
  }

  document.addEventListener('keydown', function(e){
    if (!play.on) return;
    var run = play.run;

    if (e.key === 'Escape'){ e.preventDefault(); playStop(); return; }
    if (!run) return;

    if (e.key === ' ' || e.key === 'Enter'){
      e.preventDefault();
      if (run.done){ playStop(); return; }
      if (run.opts) playChoose(run.sel);
      else playAdvance();
      return;
    }
    if (e.key === 'ArrowUp' && run.opts){
      e.preventDefault();
      run.sel = Math.max(0, run.sel - 1);
      playRender();
      return;
    }
    if (e.key === 'ArrowDown' && run.opts){
      e.preventDefault();
      run.sel = Math.min(run.opts.length - 1, run.sel + 1);
      playRender();
      return;
    }
    if (run.opts && /^[1-9]$/.test(e.key)){
      e.preventDefault();
      playChoose(Number(e.key) - 1);
    }
  });
})();

/* ============================================================
   12) INTERACTION
   ============================================================ */
function fit(){
  var d = state.doc, L = state.L;
  if (!d || !L) return;
  var stage = $('stage');
  var W = stage.clientWidth, H = stage.clientHeight;
  var maxX = 0, maxY = 0, minX = Infinity, minY = Infinity;
  var all = $('canvas').querySelectorAll('.node');
  for (var i = 0; i < all.length; i++){
    minX = Math.min(minX, all[i].offsetLeft);
    minY = Math.min(minY, all[i].offsetTop);
    maxX = Math.max(maxX, all[i].offsetLeft + all[i].offsetWidth);
    maxY = Math.max(maxY, all[i].offsetTop + all[i].offsetHeight);
  }
  if (!isFinite(minX)) return;
  var w = maxX - minX, h = maxY - minY;
  var s = Math.min(1.15, Math.min((W - 120) / w, (H - 120) / h));
  if (!isFinite(s) || s <= 0) s = 1;
  state.scale = s;
  state.tx = (W - w * s) / 2 - minX * s;
  state.ty = (H - h * s) / 2 - minY * s;
  applyTransform();
}

function setTab(name){
  var tabs = document.querySelectorAll('.tab');
  for (var i = 0; i < tabs.length; i++)
    tabs[i].classList.toggle('on', tabs[i].getAttribute('data-tab') === name);
  $('pane-detail').classList.toggle('on', name === 'detail');
  $('pane-world').classList.toggle('on', name === 'world');
  $('pane-check').classList.toggle('on', name === 'check');
}

function toMermaid(){
  var d = state.doc;
  if (!d) return '';
  var out = ['flowchart TD'];
  var mid = function(s){ return String(s).replace(/[^A-Za-z0-9_]/g, '_'); };
  d.nodes.forEach(function(n){
    var first = null;
    n.items.forEach(function(it){ if (it.kind === 'say' && !first) first = it; });
    var label = n.id.replace(/"/g, "'");
    if (first) label += '<br/>' + (first.fa || first.en).replace(/"/g, "'");
    out.push('  ' + mid(n.id) + '["' + label + '"]');
  });
  d.nodes.forEach(function(n){
    n.links.forEach(function(l){
      out.push('  ' + mid(n.id) + ' --> ' + (l.auto ? '|' + l.kind + '| ' : '') + mid(l.target));
    });
  });
  return out.join('\n');
}

(function init(){
  var stage = $('stage');
  var drag = null;

  stage.addEventListener('mousedown', function(e){
    if (e.target.closest('.node')) return;
    drag = { x:e.clientX, y:e.clientY, tx:state.tx, ty:state.ty };
    stage.classList.add('grabbing');
  });
  window.addEventListener('mousemove', function(e){
    if (!drag) return;
    state.tx = drag.tx + (e.clientX - drag.x);
    state.ty = drag.ty + (e.clientY - drag.y);
    applyTransform();
  });
  window.addEventListener('mouseup', function(){
    drag = null; stage.classList.remove('grabbing');
  });
  stage.addEventListener('wheel', function(e){
    e.preventDefault();
    var r = stage.getBoundingClientRect();
    var mx = e.clientX - r.left, my = e.clientY - r.top;
    var old = state.scale;
    var s = Math.min(2.2, Math.max(0.2, old * (e.deltaY < 0 ? 1.12 : 0.89)));
    state.tx = mx - (mx - state.tx) * (s / old);
    state.ty = my - (my - state.ty) * (s / old);
    state.scale = s;
    applyTransform();
  }, { passive:false });

  var tabs = document.querySelectorAll('.tab');
  for (var i = 0; i < tabs.length; i++){
    tabs[i].addEventListener('click', function(){ setTab(this.getAttribute('data-tab')); });
  }

  $('fitBtn').addEventListener('click', fit);
  $('openBtn').addEventListener('click', function(){ $('fileInput').click(); });

  $('fileInput').addEventListener('change', function(e){
    readFiles(Array.prototype.slice.call(e.target.files));
    e.target.value = '';
  });

  function readFiles(files){
    if (!files.length) return;
    var docs = [], left = files.length;
    files.forEach(function(f, i){
      var fr = new FileReader();
      fr.onload = function(){
        docs[i] = parseDoc(fr.result, f.name.replace(/\.[^.]+$/, ''));
        if (--left === 0){ loadDocs(docs); fit(); }
      };
      fr.readAsText(f, 'utf-8');
    });
  }

  document.addEventListener('dragover', function(e){ e.preventDefault(); });
  document.addEventListener('drop', function(e){
    e.preventDefault();
    readFiles(Array.prototype.slice.call(e.dataTransfer.files));
  });

  $('fileSel').addEventListener('change', function(e){
    state.index = Number(e.target.value);
    state.doc = state.docs[state.index] || null;
    state.sel = null;
    state.world = buildWorld(state.doc ? state.doc.vars : [], state.world);
    render();
    fit();
  });

  $('pasteBtn').addEventListener('click', function(){
    $('paste').classList.add('on');
    $('pasteArea').focus();
  });
  $('pasteCancel').addEventListener('click', function(){ $('paste').classList.remove('on'); });
  $('pasteParse').addEventListener('click', function(){
    var txt = $('pasteArea').value;
    if (!txt.trim()) return;
    var d = parseDoc(txt, 'pasted');
    $('paste').classList.remove('on');
    loadDocs([d]);
    fit();
  });

  $('mermaidBtn').addEventListener('click', function(){
    var txt = toMermaid();
    if (!txt) return;
    navigator.clipboard.writeText(txt).then(function(){
      var b = $('mermaidBtn'), old = b.textContent;
      b.textContent = 'کپی شد ✓';
      setTimeout(function(){ b.textContent = old; }, 1200);
    }).catch(function(){ window.prompt('کپی کن:', txt); });
  });

  render();
})();
</script>
